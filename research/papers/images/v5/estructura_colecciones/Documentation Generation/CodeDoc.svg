<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Flujo analítico de CODEDOC</title>
  <desc id="desc">Criterios documentales y análisis estático alimentan prompts por entidad; el LLM genera documentación que se evalúa y refina.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#526477"/>
    </marker>
    <style>
      .box{fill:#f4f7fb;stroke:#56718e;stroke-width:2;rx:14}
      .support{fill:#edf7f4;stroke:#4e8a79;stroke-width:2;rx:14}
      .t{font:600 17px Arial,sans-serif;fill:#17324d}
      .s{font:14px Arial,sans-serif;fill:#34495e}
      .a{stroke:#526477;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="390" fill="#fff"/>
  <text x="35" y="40" class="t">CODEDOC — documentación de entidades guiada por criterios</text>
  <rect class="support" x="35" y="72" width="430" height="92"/>
  <text x="55" y="103" class="t">Especificación offline</text>
  <text x="55" y="130" class="s">Estándares y guías → criterios revisados</text>
  <rect class="support" x="635" y="72" width="430" height="92"/>
  <text x="655" y="103" class="t">Contexto estructural</text>
  <text x="655" y="130" class="s">AST + grafo de llamadas + rutas</text>
  <path class="a" d="M250 164 L250 197"/>
  <path class="a" d="M850 164 L850 197"/>
  <rect class="box" x="25" y="210" width="190" height="112"/>
  <text x="45" y="244" class="t">Entidad objetivo</text>
  <text x="45" y="274" class="s">Función o clase</text>
  <text x="45" y="297" class="s">y código local</text>
  <rect class="box" x="240" y="210" width="190" height="112"/>
  <text x="260" y="244" class="t">Prompt selectivo</text>
  <text x="260" y="274" class="s">Dependencias</text>
  <text x="260" y="297" class="s">+ criterios aplicables</text>
  <rect class="box" x="455" y="210" width="190" height="112"/>
  <text x="475" y="244" class="t">LLM</text>
  <text x="475" y="274" class="s">Genera documento</text>
  <text x="475" y="297" class="s">por entidad</text>
  <rect class="box" x="670" y="210" width="190" height="112"/>
  <text x="690" y="244" class="t">Juez LLM</text>
  <text x="690" y="274" class="s">Puntuación por</text>
  <text x="690" y="297" class="s">dimensión + feedback</text>
  <rect class="box" x="885" y="210" width="190" height="112"/>
  <text x="905" y="244" class="t">Salida</text>
  <text x="905" y="274" class="s">Docs organizados</text>
  <text x="905" y="297" class="s">por ruta fuente</text>
  <path class="a" d="M215 266 L235 266"/>
  <path class="a" d="M430 266 L450 266"/>
  <path class="a" d="M645 266 L665 266"/>
  <path class="a" d="M860 266 L880 266"/>
  <path d="M765 325 C765 365 550 365 550 326" fill="none" stroke="#4e8a79" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="520" y="365" class="s">una pasada de refinamiento</text>
</svg>
